name: RenewGrid - CI, GHCR and Compose CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - '.github/workflows/renewgrid-cicd.yml'

  workflow_dispatch:

concurrency:
  group: renewgrid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # JOB 1: CONTINUOUS INTEGRATION
  # ============================================================

  validate:
    name: Validate application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install pytest httpx

      - name: Run backend smoke tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./cicd-smoke.sqlite3
          SECRET_KEY: ci-test-only-not-used-in-deployment
          REFRESH_SECRET_KEY: ci-test-only-refresh-key
        run: |
          python -m compileall -q app
          python -m pytest -q tests/test_cicd_smoke.py

  # ============================================================
  # JOB 2: BUILD AND PUBLISH CONTAINER IMAGES
  # ============================================================

  publish:
    name: Publish images to GHCR

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    needs: validate
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    outputs:
      base: ${{ steps.names.outputs.base }}
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Define image names
        id: names
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        id: api
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.names.outputs.base }}-api:sha-${{ github.sha }}
            ${{ steps.names.outputs.base }}-api:latest
          cache-from: type=gha,scope=renewgrid-api
          cache-to: type=gha,mode=max,scope=renewgrid-api
          provenance: true
          sbom: true

      - name: Build and publish frontend
        id: web
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.names.outputs.base }}-web:sha-${{ github.sha }}
            ${{ steps.names.outputs.base }}-web:latest
          cache-from: type=gha,scope=renewgrid-web
          cache-to: type=gha,mode=max,scope=renewgrid-web
          provenance: true
          sbom: true

  # ============================================================
  # JOB 3: AUTOMATED COMPOSE DEPLOYMENT VERIFICATION
  # ============================================================

  deploy-verify:
    name: Deploy with Compose and verify
    needs: publish
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure temporary deployment
        env:
          API_IMAGE: ${{ needs.publish.outputs.base }}-api@${{ needs.publish.outputs.api_digest }}
          WEB_IMAGE: ${{ needs.publish.outputs.base }}-web@${{ needs.publish.outputs.web_digest }}
        run: |
          {
            echo "POSTGRES_USER=renewgrid"
            echo "POSTGRES_DB=renewgrid"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "REFRESH_SECRET_KEY=$(openssl rand -hex 32)"
            echo "APP_PORT=8080"
            echo "APP_ENV=test"
            echo "COOKIE_SECURE=false"
            echo "API_IMAGE=$API_IMAGE"
            echo "WEB_IMAGE=$WEB_IMAGE"
          } > .env.ci

          chmod 600 .env.ci

      - name: Pull published container images
        run: docker compose --env-file .env.ci pull api web db

      - name: Deploy application
        run: docker compose --env-file .env.ci up -d --no-build

      - name: Verify application and database
        run: |
          set -euo pipefail

          for n in $(seq 1 36); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null && \
               curl --fail --silent --show-error http://127.0.0.1:8080/roles > /dev/null && \
               curl --fail --silent --show-error http://127.0.0.1:8080/config > /dev/null; then

              echo "PASS: Frontend, API and PostgreSQL-backed endpoint"

              curl --fail --silent --show-error http://127.0.0.1:8080/roles

              exit 0
            fi

            sleep 5
          done

          echo "FAIL: Compose verification failed"
          exit 1

      - name: Show diagnostic logs
        if: always()
        run: |
          docker compose --env-file .env.ci ps -a || true
          docker compose --env-file .env.ci logs --tail=70 migrate api web || true

      - name: Clean up temporary deployment
        if: always()
        run: |
          docker compose --env-file .env.ci down -v --remove-orphans || true
          rm -f .env.ci
